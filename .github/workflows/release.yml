name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Build/test jobs are read-only. Write/OIDC permissions exist only in the small promotion jobs
# that consume already-tested workflow artifacts; no repository code is built with a write token.
permissions:
  contents: read

# Serialise retries for the same tag. Without this, two runs can both pass preflight and one
# failed creator can race with or clean up the other run's draft release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Pull requests and manual runs exercise the complete read-only candidate path. Promotion jobs
  # remain tag-only. PR ref names contain '/', so use a filesystem-safe label for SBOM assets.
  ASSET_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('candidate-{0}', github.sha) }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag ancestry and canonical project version before secrets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          # NuGet normalizes leading zeroes, drops build metadata and a zero fourth component,
          # and considers 1 / 1.0 / 1.0.0 / 1.0.0.0 equal. Requiring one canonical stable form
          # makes the raw flat-container collision check below exact rather than normalization-
          # dependent (and excludes prerelease/build-metadata tags).
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tags must use canonical stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          for project in src/QrShard/QrShard.csproj src/QrShard.Core/QrShard.Core.csproj; do
            project_version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' "$project" | head -1)"
            [ "$version" = "$project_version" ] || {
              echo "::error::tag version $version does not match $project version $project_version"; exit 1;
            }
          done
          # Package existence is reconciled against the exact tested candidates in publish-nuget.
          # Checking only a version here made a safe retry impossible after one of the two
          # immutable package pushes succeeded and the next remote write failed.

      - name: Protected release gate must exist
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          environment="$(gh api "repos/$GH_REPO/environments/release")"
          jq -e '
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true and
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              .prevent_self_review == false and
              (.reviewers | length) > 0)
          ' <<< "$environment" >/dev/null || {
            echo "::error::release environment must require a self-approving reviewer, disable admin bypass, and use only custom tag policies"
            exit 1
          }
          policies="$(gh api "repos/$GH_REPO/environments/release/deployment-branch-policies")"
          jq -e '
            .total_count == 1 and
            (.branch_policies | length) == 1 and
            .branch_policies[0].name == "v*" and
            .branch_policies[0].type == "tag"
          ' <<< "$policies" >/dev/null || {
            echo "::error::release environment must allow only the v* tag policy"
            exit 1
          }
          mapfile -t tag_rulesets < <(gh api "repos/$GH_REPO/rulesets" --paginate --jq \
            '.[] | select(.name == "Protect release tags" and .target == "tag" and .enforcement == "active") | .id')
          [ "${#tag_rulesets[@]}" -eq 1 ] || {
            echo "::error::expected one active Protect release tags ruleset"; exit 1;
          }
          tag_ruleset="$(gh api "repos/$GH_REPO/rulesets/${tag_rulesets[0]}")"
          jq -e '
            .conditions.ref_name.include == ["refs/tags/v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == ["deletion", "update"]
          ' <<< "$tag_ruleset" >/dev/null || {
            echo "::error::release tag ruleset must block update/deletion of refs/tags/v*"
            exit 1
          }

  binaries:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            asset: qrshard-win-x64.zip
            strip_symbols: "false"
          # Native-AOT Linux binaries require the glibc of the build host or newer. Build x64 on
          # Ubuntu 22.04 deliberately (glibc 2.35), rather than a moving ubuntu-latest floor.
          - os: ubuntu-22.04
            rid: linux-x64
            asset: qrshard-linux-x64.tar.gz
            strip_symbols: "true"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            asset: qrshard-linux-arm64.tar.gz
            strip_symbols: "true"
          - os: macos-15
            rid: osx-arm64
            asset: qrshard-osx-arm64.tar.gz
            # .NET 10.0.10's Apple runtime archive contains stale Clang module-cache
            # references. Defer dsymutil/strip to the checked step below so MSBuild's
            # Exec parser cannot turn dsymutil's successful diagnostic into a failure.
            strip_symbols: "false"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      # Actions are pinned to immutable commit SHAs throughout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Record toolchain
        run: dotnet --info

      - name: Record Apple toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          xcode-select --print-path
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --find clang
          xcrun clang --version
          xcrun --find dsymutil
          xcrun dsymutil --version

      - name: Test
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet test tests/QrShard.Tests/QrShard.Tests.csproj -c Release -warnaserror

      - name: Publish (Native AOT)
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        # One packages.lock.json cannot represent four mutually exclusive RID-specific AOT
        # graphs. The SDK/runtime/compiler packs are version-pinned by global.json/.NET 10.0.10
        # and semantically checked in the per-RID SBOM below; disable locked mode only for this
        # matrix restore while keeping every framework-dependent restore locked. Write the AOT
        # graph under ignored obj/ so this restore can never rewrite the committed portable graph.
        run: dotnet publish src/QrShard/QrShard.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PackAsTool=false -p:StripSymbols=${{ matrix.strip_symbols }} -p:RestoreLockedMode=false -p:NuGetLockFilePath=obj/aot/${{ matrix.rid }}/packages.lock.json -warnaserror

      - name: Finalize macOS symbols and ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          pub="src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish"
          bin="$pub/QrShard"
          dsym="$bin.dSYM"
          dwarf="$dsym/Contents/Resources/DWARF/QrShard"

          [ -s "$bin" ] || { echo "::error::no macOS Native-AOT binary at $bin"; exit 1; }
          [ ! -e "$dsym" ] || { echo "::error::unexpected pre-existing dSYM at $dsym"; exit 1; }

          uuid_set() {
            xcrun dwarfdump --uuid "$1" |
              awk '/^UUID: / { print toupper($2) " " $3 }' |
              LC_ALL=C sort
          }

          # Reproduce the .NET Native-AOT target's normal Apple post-link operations directly.
          # dsymutil's real exit status remains authoritative while its known stale-.pcm
          # diagnostic remains visible instead of being misparsed by MSBuild's Exec task.
          # Remove this workaround after upgrading to .NET targets containing
          # https://github.com/dotnet/runtime/pull/124266.
          if ! xcrun dsymutil "$bin"; then
            echo "::error::dsymutil failed for the macOS Native-AOT binary"
            exit 1
          fi
          [ -s "$dwarf" ] || { echo "::error::dsymutil did not create $dwarf"; exit 1; }

          binary_uuids="$(uuid_set "$bin")"
          symbol_uuids="$(uuid_set "$dwarf")"
          uuid_count="$(printf '%s\n' "$binary_uuids" | sed '/^$/d' | wc -l | tr -d ' ')"
          [ "$uuid_count" = "1" ] && [[ "$binary_uuids" == *" (arm64)" ]] || {
            echo "::error::expected one arm64 UUID, got '$binary_uuids'"; exit 1;
          }
          [ "$binary_uuids" = "$symbol_uuids" ] || {
            echo "::error::dSYM UUIDs '$symbol_uuids' do not match binary UUIDs '$binary_uuids'"; exit 1;
          }

          if ! xcrun strip -no_code_signature_warning -x "$bin"; then
            echo "::error::strip failed for the macOS Native-AOT binary"
            exit 1
          fi
          # Normalize the final Apple-silicon executable to the documented ad-hoc policy.
          # Replace this step rather than layering over it if Developer ID signing is added.
          /usr/bin/codesign --force --sign - --timestamp=none "$bin"
          /usr/bin/codesign --verify --strict --verbose=4 "$bin"

          final_uuids="$(uuid_set "$bin")"
          [ "$final_uuids" = "$binary_uuids" ] || {
            echo "::error::macOS binary UUIDs changed during strip/sign finalization"; exit 1;
          }

      - name: Verify portable lock files remained unchanged
        run: git diff --exit-code -- src/QrShard.Core/packages.lock.json src/QrShard/packages.lock.json tests/QrShard.Benchmarks/packages.lock.json tests/QrShard.Tests/packages.lock.json

      - name: Include redistribution notices
        shell: bash
        run: |
          set -euo pipefail
          pub="src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish"
          cp LICENSE "$pub/LICENSE"
          cp THIRD-PARTY-NOTICES.md "$pub/THIRD-PARTY-NOTICES.md"
          cp licenses/Apache-2.0.txt "$pub/IMAGESHARP-APACHE-2.0.txt"
          runtime="$HOME/.nuget/packages/microsoft.netcore.app.runtime.nativeaot.${{ matrix.rid }}/10.0.10"
          cp "$runtime/LICENSE.TXT" "$pub/DOTNET-LICENSE.txt"
          cp "$runtime/THIRD-PARTY-NOTICES.TXT" "$pub/DOTNET-THIRD-PARTY-NOTICES.txt"
          aot="$HOME/.nuget/packages/microsoft.dotnet.ilcompiler/10.0.10"
          cmp "$runtime/THIRD-PARTY-NOTICES.TXT" "$aot/THIRD-PARTY-NOTICES.TXT" || {
            cp "$aot/THIRD-PARTY-NOTICES.TXT" "$pub/DOTNET-AOT-THIRD-PARTY-NOTICES.txt";
          }

      - name: Smoke-test the exact binary
        shell: bash
        run: |
          set -euo pipefail
          pub="src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish"
          bin="$pub/QrShard"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          if [ ! -f "$bin" ]; then
            echo "::error::no binary at $bin"
            ls -la "$pub" || true
            exit 1
          fi
          [ -x "$bin" ] || chmod +x "$bin"

          actual="$("$bin" --version)"
          version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/QrShard/QrShard.csproj | head -1)"
          expected="qrshard $version"
          [ "$actual" = "$expected" ] || {
            echo "::error::binary reports '$actual' but tag expects '$expected'"; exit 1;
          }
          "$bin" test

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          head -c 300000 /dev/urandom > "$work/payload.bin"
          "$bin" encode "$work/payload.bin" -o "$work/shards" -r 900 -R 25 > /dev/null
          removed=""
          for candidate in "$work"/shards/*.qrs[0-9]*of[0-9]*.png; do
            [ -f "$candidate" ] || continue
            removed="$candidate"
            break
          done
          [ -n "$removed" ] || { echo "::error::no data shard found"; exit 1; }
          case "$(basename "$removed")" in *qrs-parity*) echo "::error::selected parity, not data"; exit 1;; esac
          rm -- "$removed"
          "$bin" decode "$work/shards" -o "$work/out.bin" > /dev/null
          cmp -s "$work/payload.bin" "$work/out.bin" || {
            echo "::error::parity round trip did not reproduce the input"; exit 1;
          }

          # Archive path-collision checks depend on full globalization. Exercise the exact AOT
          # binary with canonically equivalent names; it must reject the archive before output.
          mkdir -p "$work/archive"
          printf composed > "$work/archive/é.txt"
          printf decomposed > "$work/archive/$(printf 'e\314\201').txt"
          alias_count="$(find "$work/archive" -maxdepth 1 -type f | wc -l)"
          if [ "$alias_count" -eq 2 ]; then
            if "$bin" encode "$work/archive" -o "$work/archive-shards" -r 900 > "$work/archive.log" 2>&1; then
              echo "::error::exact binary accepted canonically colliding archive paths"; exit 1;
            fi
            grep -qiE 'collid|duplicate|same .*path' "$work/archive.log" || {
              echo "::error::archive alias rejection was not diagnostic"; cat "$work/archive.log"; exit 1;
            }
          elif [ "$alias_count" -ne 1 ]; then
            echo "::error::could not construct archive normalization smoke input"; exit 1;
          fi

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish/* -DestinationPath ${{ matrix.asset }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }} -C src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish .

      - name: Generate and validate the exact binary SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/QrShard/QrShard.csproj | head -1)"
          tool_dir="$RUNNER_TEMP/sbom-tool"
          input_dir="$RUNNER_TEMP/sbom-input"
          output_dir="$RUNNER_TEMP/sbom-output"
          mkdir -p "$input_dir" "$output_dir"
          cp "${{ matrix.asset }}" "$input_dir/"
          dotnet tool install Microsoft.Sbom.DotNetTool --version 4.1.5 --tool-path "$tool_dir"
          sbom_tool="$tool_dir/sbom-tool"
          [ "${{ runner.os }}" = Windows ] && sbom_tool="$sbom_tool.exe"

          # The preceding Native-AOT publish produced this target's project.assets.json on the
          # same OS/architecture that built the exact archive. This keeps host-only compiler packs
          # from contaminating a cross-RID graph.
          "$sbom_tool" generate \
            -b "$input_dir" -bc "$GITHUB_WORKSPACE/src/QrShard" -m "$output_dir" \
            -pn "QrShard.NativeAOT.${{ matrix.rid }}" -pv "$version" -ps "Lee Farrand" \
            -nsb "https://github.com/$GITHUB_REPOSITORY" -mi SPDX:2.2 \
            -F false -pm true -V Warning
          manifest="$output_dir/_manifest/spdx_2.2/manifest.spdx.json"
          "$sbom_tool" validate -b "$input_dir" -m "$output_dir/_manifest" \
            -o "$RUNNER_TEMP/sbom-validation.json" -mi SPDX:2.2 -F false -n true -V Warning

          jq -e --arg version "$version" \
            --arg runtime "Microsoft.NETCore.App.Runtime.NativeAOT.${{ matrix.rid }}" \
            --arg compiler "runtime.${{ matrix.rid }}.Microsoft.DotNet.ILCompiler" '
              .spdxVersion == "SPDX-2.2" and
              (.files | length) == 1 and
              ([.packages[]? | select(
                (.name | ascii_downcase) |
                test("^(xunit|benchmarkdotnet|microsoft\\.sbom)"))] | length) == 0 and
              ([.packages[]? | select(
                (.name | startswith("QrShard")) and .versionInfo != $version)] | length) == 0 and
              any(.packages[]?; .name == "SixLabors.ImageSharp" and .versionInfo == "4.0.0") and
              any(.packages[]?; .name == "System.IO.Hashing" and .versionInfo == "10.0.10") and
              any(.packages[]?; .name == "Microsoft.Extensions.DependencyInjection" and .versionInfo == "10.0.10") and
              ([.packages[]? | select(.name | startswith("Microsoft.NETCore.App.Runtime.NativeAOT."))] | length) == 1 and
              any(.packages[]?; .name == $runtime and .versionInfo == "10.0.10") and
              ([.packages[]? | select(.name | test("^runtime\\..*\\.Microsoft\\.DotNet\\.ILCompiler$"))] | length) == 1 and
              any(.packages[]?; .name == $compiler and .versionInfo == "10.0.10")
            ' "$manifest" >/dev/null || {
              echo "::error::${{ matrix.rid }} SBOM has a wrong-RID, stale, or non-production graph"; exit 1;
            }
          cp "$manifest" "qrshard-${{ matrix.rid }}-$ASSET_LABEL.spdx.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.rid }}
          path: |
            ${{ matrix.asset }}
            qrshard-${{ matrix.rid }}-${{ env.ASSET_LABEL }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Pack once
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/QrShard/QrShard.csproj | head -1)"
          dotnet pack src/QrShard/QrShard.csproj -c Release -o nupkg -p:Version="$version" -warnaserror
          dotnet pack src/QrShard.Core/QrShard.Core.csproj -c Release -o nupkg -p:Version="$version" -warnaserror

      - name: Consumer-test those exact package bytes
        env:
          QRSHARD_PREBUILT_FEED: ${{ github.workspace }}/nupkg
        run: |
          export QRSHARD_PACKAGE_VERSION="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/QrShard/QrShard.csproj | head -1)"
          tests/verify-package-consumer.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  sbom:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: release-inputs/packages

      - name: Stage exact package-specific SBOM inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/QrShard/QrShard.csproj | head -1)"
          mkdir -p release-inputs/tool-package release-inputs/core-package release-sbom sbom-output
          [ -f "release-inputs/packages/QrShard.Tool.$version.nupkg" ] || {
            echo "::error::missing exact QrShard.Tool package"; exit 1;
          }
          [ -f "release-inputs/packages/QrShard.Core.$version.nupkg" ] || {
            echo "::error::missing exact QrShard.Core package"; exit 1;
          }
          [ "$(find release-inputs/packages -maxdepth 1 -type f | wc -l)" -eq 2 ] || {
            echo "::error::expected exactly two NuGet packages"; exit 1;
          }
          cp "release-inputs/packages/QrShard.Tool.$version.nupkg" release-inputs/tool-package/
          cp "release-inputs/packages/QrShard.Core.$version.nupkg" release-inputs/core-package/

      - name: Generate and semantically validate SPDX 2.2 SBOMs
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/QrShard/QrShard.csproj | head -1)"
          tool_dir="$RUNNER_TEMP/sbom-tool"
          dotnet tool install Microsoft.Sbom.DotNetTool --version 4.1.5 --tool-path "$tool_dir"
          sbom_tool="$tool_dir/sbom-tool"

          generate_sbom() {
            local build_dir="$1" component_dir="$2" output_dir="$3" product="$4"
            mkdir -p "$GITHUB_WORKSPACE/$output_dir"
            "$sbom_tool" generate \
              -b "$GITHUB_WORKSPACE/$build_dir" \
              -bc "$GITHUB_WORKSPACE/$component_dir" \
              -m "$GITHUB_WORKSPACE/$output_dir" \
              -pn "$product" -pv "$version" -ps "Lee Farrand" \
              -nsb "https://github.com/$GITHUB_REPOSITORY" -mi SPDX:2.2 \
              -F false -pm true -V Warning
          }

          validate_sbom() {
            local build_dir="$1" output_dir="$2" manifest="$3" label="$4"
            "$sbom_tool" validate -b "$build_dir" \
              -m "$output_dir/_manifest" -o "$RUNNER_TEMP/$label-validation.json" \
              -mi SPDX:2.2 -F false -n true -V Warning
            jq -e --arg version "$version" '
              .spdxVersion == "SPDX-2.2" and
              (.files | length) == 1 and
              ([.packages[]? | select(
                (.name | ascii_downcase) |
                test("^(xunit|benchmarkdotnet|microsoft\\.sbom)"))] | length) == 0 and
              ([.packages[]? | select(
                (.name | startswith("QrShard")) and .versionInfo != $version)] | length) == 0
            ' "$manifest" >/dev/null || {
              echo "::error::$label SBOM contains stale/non-production components or an unexpected file set"; exit 1;
            }
          }

          validate_cli_dependencies() {
            local manifest="$1" label="$2"
            jq -e '
              any(.packages[]?; .name == "SixLabors.ImageSharp" and .versionInfo == "4.0.0") and
              any(.packages[]?; .name == "System.IO.Hashing" and .versionInfo == "10.0.10") and
              any(.packages[]?; .name == "Microsoft.Extensions.DependencyInjection" and .versionInfo == "10.0.10")
            ' "$manifest" >/dev/null || {
              echo "::error::$label SBOM is missing pinned production dependencies"; exit 1;
            }
          }

          # Package SBOMs intentionally use the ordinary framework-dependent restore graph rather
          # than any RID-specific Native-AOT graph.
          dotnet restore src/QrShard/QrShard.csproj -p:PublishAot=false --force
          tool_output="sbom-output/tool-package"
          generate_sbom release-inputs/tool-package src/QrShard "$tool_output" QrShard.Tool
          tool_manifest="$tool_output/_manifest/spdx_2.2/manifest.spdx.json"
          validate_sbom release-inputs/tool-package "$tool_output" "$tool_manifest" tool-package
          validate_cli_dependencies "$tool_manifest" tool-package
          jq -e '([.packages[]? | select(.name | startswith("Microsoft.NETCore.App.Runtime.NativeAOT."))] | length) == 0' \
            "$tool_manifest" >/dev/null || {
              echo "::error::tool-package SBOM inherited a Native-AOT runtime graph"; exit 1;
            }
          cp "$tool_manifest" "release-sbom/qrshard-tool-$ASSET_LABEL.spdx.json"

          dotnet restore src/QrShard.Core/QrShard.Core.csproj -p:PublishAot=false --force
          core_output="sbom-output/core-package"
          generate_sbom release-inputs/core-package src/QrShard.Core "$core_output" QrShard.Core
          core_manifest="$core_output/_manifest/spdx_2.2/manifest.spdx.json"
          validate_sbom release-inputs/core-package "$core_output" "$core_manifest" core-package
          jq -e '
            any(.packages[]?; .name == "SixLabors.ImageSharp" and .versionInfo == "4.0.0") and
            any(.packages[]?; .name == "System.IO.Hashing" and .versionInfo == "10.0.10") and
            ([.packages[]? | select(.name | startswith("Microsoft.NETCore.App.Runtime.NativeAOT."))] | length) == 0
          ' "$core_manifest" >/dev/null || {
            echo "::error::Core package SBOM has the wrong production dependency graph"; exit 1;
          }
          cp "$core_manifest" "release-sbom/qrshard-core-$ASSET_LABEL.spdx.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: release-sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  create-draft:
    needs: [binaries, packages, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-assets

      - name: Checksum every candidate artifact
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            qrshard-win-x64.zip
            qrshard-linux-x64.tar.gz
            qrshard-linux-arm64.tar.gz
            qrshard-osx-arm64.tar.gz
            "QrShard.Tool.$version.nupkg"
            "QrShard.Core.$version.nupkg"
            "qrshard-win-x64-$GITHUB_REF_NAME.spdx.json"
            "qrshard-linux-x64-$GITHUB_REF_NAME.spdx.json"
            "qrshard-linux-arm64-$GITHUB_REF_NAME.spdx.json"
            "qrshard-osx-arm64-$GITHUB_REF_NAME.spdx.json"
            "qrshard-tool-$GITHUB_REF_NAME.spdx.json"
            "qrshard-core-$GITHUB_REF_NAME.spdx.json"
          )
          [ "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}" ] || {
            echo "::error::release candidate contains an unexpected number of files"; exit 1;
          }
          for asset in "${expected[@]}"; do
            [ -f "$asset" ] || { echo "::error::missing release candidate $asset"; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS

      - name: Release tag must still resolve to the event commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")"
          sha="$(jq -r .object.sha <<< "$response")"
          type="$(jq -r .object.type <<< "$response")"
          for _ in {1..8}; do
            if [ "$type" = commit ]; then break; fi
            [ "$type" = tag ] || {
              echo "::error::release tag resolves to unsupported Git object type '$type'"; exit 1;
            }
            response="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            sha="$(jq -r .object.sha <<< "$response")"
            type="$(jq -r .object.type <<< "$response")"
          done
          [ "$type" = commit ] && [ "$sha" = "$GITHUB_SHA" ] || {
            echo "::error::$GITHUB_REF_NAME resolves to $type $sha, not event commit $GITHUB_SHA"; exit 1;
          }

      - name: Attest build provenance for every release file
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*

      - name: Attest win-x64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/qrshard-win-x64.zip
          sbom-path: release-assets/qrshard-win-x64-${{ github.ref_name }}.spdx.json

      - name: Attest linux-x64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/qrshard-linux-x64.tar.gz
          sbom-path: release-assets/qrshard-linux-x64-${{ github.ref_name }}.spdx.json

      - name: Attest linux-arm64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/qrshard-linux-arm64.tar.gz
          sbom-path: release-assets/qrshard-linux-arm64-${{ github.ref_name }}.spdx.json

      - name: Attest osx-arm64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/qrshard-osx-arm64.tar.gz
          sbom-path: release-assets/qrshard-osx-arm64-${{ github.ref_name }}.spdx.json

      - name: Attest tool-package SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/QrShard.Tool.*.nupkg
          sbom-path: release-assets/qrshard-tool-${{ github.ref_name }}.spdx.json

      - name: Attest core-package SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/QrShard.Core.*.nupkg
          sbom-path: release-assets/qrshard-core-${{ github.ref_name }}.spdx.json

      - name: Create one complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")"
          sha="$(jq -r .object.sha <<< "$response")"
          type="$(jq -r .object.type <<< "$response")"
          for _ in {1..8}; do
            if [ "$type" = commit ]; then break; fi
            [ "$type" = tag ] || {
              echo "::error::release tag resolves to unsupported Git object type '$type'"; exit 1;
            }
            response="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            sha="$(jq -r .object.sha <<< "$response")"
            type="$(jq -r .object.type <<< "$response")"
          done
          [ "$type" = commit ] && [ "$sha" = "$GITHUB_SHA" ] || {
            echo "::error::$GITHUB_REF_NAME moved before draft creation"; exit 1;
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ] || {
              echo "::error::release $GITHUB_REF_NAME already exists and is public; refusing mutation"
              exit 1
            }
          else
            # Leave a partial draft in place on a lost/failed upload response. A rerun reconciles
            # it below; deleting it could discard the only exact candidate after a partial NuGet
            # publication and sever the release's byte-provenance chain.
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          fi

          mapfile -t expected_assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t remote_assets < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          for remote in "${remote_assets[@]}"; do
            printf '%s\n' "${expected_assets[@]}" | grep -Fqx -- "$remote" || {
              echo "::error::draft contains unexpected asset '$remote'; refusing automatic mutation"
              exit 1
            }
          done

          mkdir existing-draft
          if [ "${#remote_assets[@]}" -gt 0 ]; then
            gh release download "$GITHUB_REF_NAME" --dir existing-draft
          fi
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            if [ -f "existing-draft/$name" ]; then
              cmp -s "$asset" "existing-draft/$name" || {
                echo "::error::existing draft asset '$name' differs from this run's tested candidate"
                exit 1
              }
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done

  publish-nuget:
    needs: [binaries, packages, create-draft]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkg

      - name: NuGet publishing must be configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo "::error::NUGET_USER is not configured"; exit 1; }

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Reconcile the tested packages with NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find nupkg -maxdepth 1 -type f -name '*.nupkg' -print | sort)
          version="${GITHUB_REF_NAME#v}"
          expected=("nupkg/QrShard.Core.$version.nupkg" "nupkg/QrShard.Tool.$version.nupkg")
          [ "${packages[*]}" = "${expected[*]}" ] || {
            echo "::error::expected only QrShard.Core/Tool $version candidates"; printf '%s\n' "${packages[@]}"; exit 1;
          }

          # This bounded comparator is part of the protected workflow itself. The credentialed
          # job intentionally has no checkout and executes no repository-controlled scripts.
          compare_package() {
            python3 - "$1" "$2" "$3" <<'PY'
          import hashlib, pathlib, sys, zipfile
          MAX_ENTRIES=10000; MAX_NAME=4096; MAX_ENTRY=256*1024*1024
          MAX_TOTAL=512*1024*1024; MAX_SIGNATURE=1024*1024; SIGNATURE='.signature.p7s'
          def fail(message): raise SystemExit('package comparison failed: '+message)
          def inventory(raw, signature_required):
              path=pathlib.Path(raw); result={}; folded=set(); signatures=0; total=0
              try: archive=zipfile.ZipFile(path, 'r')
              except (OSError, zipfile.BadZipFile) as error: fail(f'{path.name} is not a readable ZIP: {error}')
              with archive:
                  entries=archive.infolist()
                  if len(entries)>MAX_ENTRIES: fail(f'{path.name} has too many entries')
                  for entry in entries:
                      name=entry.filename
                      if not name or len(name)>MAX_NAME or '\\' in name or '\0' in name:
                          fail(f'{path.name} contains an unsafe ZIP entry name')
                      pure=pathlib.PurePosixPath(name)
                      if pure.is_absolute() or '..' in pure.parts: fail(f'{path.name} contains an unsafe ZIP path')
                      folded_name=name.casefold()
                      if folded_name in folded: fail(f'{path.name} contains duplicate/case-colliding entries')
                      folded.add(folded_name)
                      if entry.flag_bits & 1: fail(f'{path.name} contains an encrypted ZIP entry')
                      if entry.file_size>MAX_ENTRY: fail(f'{path.name} contains an oversized entry')
                      total += entry.file_size
                      if total>MAX_TOTAL: fail(f'{path.name} exceeds the uncompressed-size limit')
                      if folded_name==SIGNATURE:
                          if name!=SIGNATURE or entry.is_dir() or entry.file_size>MAX_SIGNATURE:
                              fail(f'{path.name} has an invalid signature entry')
                          signatures += 1
                          with archive.open(entry) as stream:
                              while stream.read(1024*1024): pass
                          continue
                      kind=(entry.external_attr >> 16) & 0o170000
                      if kind==0o120000: fail(f'{path.name} contains a symbolic-link entry')
                      digest=hashlib.sha256()
                      with archive.open(entry) as stream:
                          while chunk:=stream.read(1024*1024): digest.update(chunk)
                      result[name]=(entry.file_size,digest.hexdigest(),entry.external_attr,entry.flag_bits,entry.is_dir())
              if signatures != (1 if signature_required else 0):
                  fail(f'{path.name} has {signatures} signature entries')
              return result
          expected=inventory(sys.argv[1], False); actual=inventory(sys.argv[2], sys.argv[3]=='required')
          if expected!=actual:
              missing=sorted(expected.keys()-actual.keys()); extra=sorted(actual.keys()-expected.keys())
              changed=sorted(k for k in expected.keys()&actual.keys() if expected[k]!=actual[k])
              def brief(label,names): return f'{label}={len(names)} {names[:20]!r}'
              fail('content differs ('+', '.join((brief('missing',missing),brief('extra',extra),brief('changed',changed)))+')')
          PY
          }

          # Validate every candidate before the first irreversible registry write.
          for package in "${packages[@]}"; do compare_package "$package" "$package" forbidden; done

          service="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --location \
            --proto '=https' --proto-redir '=https' \
            https://api.nuget.org/v3/index.json)"
          package_base="$(jq -r '.resources[] | select((."@type" | tostring) | contains("PackageBaseAddress")) | ."@id"' \
            <<< "$service" | head -1)"
          [ -n "$package_base" ] && [ "$package_base" != null ] || {
            echo "::error::NuGet.org service index has no PackageBaseAddress"; exit 1;
          }
          package_base="${package_base%/}/"

          github_service="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --location \
            --proto '=https' --proto-redir '=https' -u "$GITHUB_ACTOR:$GH_PACKAGES_TOKEN" \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json")"
          github_base="$(jq -r '.resources[] | select((."@type" | tostring) | contains("PackageBaseAddress")) | ."@id"' \
            <<< "$github_service" | head -1)"
          [ -n "$github_base" ] && [ "$github_base" != null ] || {
            echo "::error::GitHub Packages service index has no PackageBaseAddress"; exit 1;
          }
          github_base="${github_base%/}/"

          # Phase one is read-only across BOTH immutable registries. Validate every version that
          # already exists before publishing either missing package anywhere, so a conflicting
          # retry cannot cause a new partial release before it is detected.
          declare -A nuget_missing
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            id="${name%.$version.nupkg}"
            lower_id="$(tr '[:upper:]' '[:lower:]' <<< "$id" | tr -d '\n')"

            index_file="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-all-errors --location \
              --proto '=https' --proto-redir '=https' -o "$index_file" -w '%{http_code}' \
              "${package_base}${lower_id}/index.json")"
            case "$status" in
              200)
                jq -e '.versions | type == "array" and all(.[]; type == "string")' "$index_file" >/dev/null || {
                  echo "::error::NuGet.org returned a malformed package index"; exit 1;
                }
                if jq -e --arg version "$version" '.versions | index($version) != null' "$index_file" >/dev/null; then
                  remote="$(mktemp)"
                  curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                    --max-filesize 200000000 \
                    "${package_base}${lower_id}/${version}/${lower_id}.${version}.nupkg" -o "$remote"
                  dotnet nuget verify "$remote" --all
                  compare_package "$package" "$remote" required
                  rm -f "$remote"
                else
                  nuget_missing["$package"]=1
                fi
                ;;
              404) nuget_missing["$package"]=1 ;;
              *) echo "::error::NuGet.org package index returned HTTP $status"; exit 1 ;;
            esac
            rm -f "$index_file"

            index_file="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-all-errors --location \
              --proto '=https' --proto-redir '=https' -o "$index_file" -w '%{http_code}' \
              -u "$GITHUB_ACTOR:$GH_PACKAGES_TOKEN" "${github_base}${lower_id}/index.json")"
            case "$status" in
              200)
                jq -e '.versions | type == "array" and all(.[]; type == "string")' "$index_file" >/dev/null || {
                  echo "::error::GitHub Packages returned a malformed package index"; exit 1;
                }
                if jq -e --arg version "$version" '.versions | index($version) != null' "$index_file" >/dev/null; then
                  remote="$(mktemp)"
                  curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                    --max-filesize 200000000 -u "$GITHUB_ACTOR:$GH_PACKAGES_TOKEN" \
                    "${github_base}${lower_id}/${version}/${lower_id}.${version}.nupkg" -o "$remote"
                  cmp -s "$package" "$remote" || {
                    echo "::error::GitHub Packages copy of $id $version differs from the tested candidate"; exit 1;
                  }
                  rm -f "$remote"
                fi
                ;;
              404) ;;
              *) echo "::error::GitHub Packages index returned HTTP $status"; exit 1 ;;
            esac
            rm -f "$index_file"
          done

          # Phase two publishes only NuGet.org versions proven absent above, then reconciles the
          # registry copy after any success, failure, or ambiguous network response.
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            id="${name%.$version.nupkg}"
            [ "$id" != "$name" ] || { echo "::error::unexpected package filename '$name'"; exit 1; }
            lower_id="$(tr '[:upper:]' '[:lower:]' <<< "$id" | tr -d '\n')"
            base="${package_base}${lower_id}/"
            if [ "${nuget_missing[$package]:-0}" -eq 1 ]; then
              # A failed response can be ambiguous: the immutable write may have succeeded. Poll
              # and authenticate the registry copy below rather than blindly retrying/skip-duplicate.
              dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json || true
            fi

            remote="$(mktemp)"
            found=0
            for _ in {1..18}; do
              if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                   --max-filesize 200000000 \
                   "${base}${version}/${lower_id}.${version}.nupkg" -o "$remote"; then
                found=1
                break
              fi
              sleep 10
            done
            [ "$found" -eq 1 ] || {
              echo "::error::$id $version is still absent after the publication/recovery window"
              exit 1
            }
            dotnet nuget verify "$remote" --all
            compare_package "$package" "$remote" required
            rm -f "$remote"
          done

      - name: Reconcile the exact same bytes with GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find nupkg -maxdepth 1 -type f -name '*.nupkg' -print | sort)
          version="${GITHUB_REF_NAME#v}"
          expected=("nupkg/QrShard.Core.$version.nupkg" "nupkg/QrShard.Tool.$version.nupkg")
          [ "${packages[*]}" = "${expected[*]}" ] || {
            echo "::error::expected only QrShard.Core/Tool $version candidates"; exit 1;
          }
          service="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --location \
            --proto '=https' --proto-redir '=https' \
            -u "$GITHUB_ACTOR:$GH_PACKAGES_TOKEN" \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json")"
          base="$(jq -r '.resources[] | select((."@type" | tostring) | contains("PackageBaseAddress")) | ."@id"' \
            <<< "$service" | head -1)"
          [ -n "$base" ] && [ "$base" != null ] || {
            echo "::error::GitHub Packages service index has no PackageBaseAddress"; exit 1;
          }
          base="${base%/}/"

          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            id="${name%.$version.nupkg}"
            [ "$id" != "$name" ] || { echo "::error::unexpected package filename '$name'"; exit 1; }
            lower_id="$(tr '[:upper:]' '[:lower:]' <<< "$id" | tr -d '\n')"
            index_file="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-all-errors --location \
              --proto '=https' --proto-redir '=https' -o "$index_file" \
              -w '%{http_code}' -u "$GITHUB_ACTOR:$GH_PACKAGES_TOKEN" \
              "${base}${lower_id}/index.json")"
            exists=0
            case "$status" in
              200)
                jq -e '.versions | type == "array" and all(.[]; type == "string")' "$index_file" >/dev/null || {
                  echo "::error::GitHub Packages returned a malformed package index"; exit 1;
                }
                if jq -e --arg version "$version" '.versions | index($version) != null' "$index_file" >/dev/null; then
                  exists=1
                fi
                ;;
              404) ;;
              *) echo "::error::GitHub Packages index returned HTTP $status"; exit 1 ;;
            esac
            rm -f "$index_file"
            if [ "$exists" -eq 0 ]; then
              dotnet nuget push "$package" \
                --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json || true
            fi

            remote="$(mktemp)"
            found=0
            for _ in {1..18}; do
              if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                   --max-filesize 200000000 \
                   -u "$GITHUB_ACTOR:$GH_PACKAGES_TOKEN" \
                   "${base}${lower_id}/$version/$lower_id.$version.nupkg" -o "$remote"; then
                found=1
                break
              fi
              sleep 10
            done
            [ "$found" -eq 1 ] || {
              echo "::error::$id $version is still absent from GitHub Packages after the recovery window"
              exit 1
            }
            cmp -s "$package" "$remote" || {
              echo "::error::GitHub Packages copy of $id $version differs from the tested candidate"
              exit 1
            }
            rm -f "$remote"
          done

