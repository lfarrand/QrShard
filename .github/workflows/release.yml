          for _ in {1..8}; do
            if [ "$type" = commit ]; then break; fi
            [ "$type" = tag ] || {
              echo "::error::release tag resolves to unsupported Git object type '$type'"; exit 1;
            }
            response="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            sha="$(jq -r .object.sha <<< "$response")"
            type="$(jq -r .object.type <<< "$response")"
          done
          [ "$type" = commit ] && [ "$sha" = "$GITHUB_SHA" ] || {
            echo "::error::$GITHUB_REF_NAME moved before publication"; exit 1;
          }
          [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "::error::$GITHUB_REF_NAME is missing or is not the draft built by this run"; exit 1;
          }

          version="${GITHUB_REF_NAME#v}"
          expected=(
            qrshard-win-x64.zip
            qrshard-linux-x64.tar.gz
            qrshard-linux-arm64.tar.gz
            qrshard-osx-arm64.tar.gz
            "QrShard.Tool.$version.nupkg"
            "QrShard.Core.$version.nupkg"
            "qrshard-win-x64-$ASSET_LABEL.spdx.json"
            "qrshard-linux-x64-$ASSET_LABEL.spdx.json"
            "qrshard-linux-arm64-$ASSET_LABEL.spdx.json"
            "qrshard-osx-arm64-$ASSET_LABEL.spdx.json"
            "qrshard-tool-$ASSET_LABEL.spdx.json"
            "qrshard-core-$ASSET_LABEL.spdx.json"
          )
          [ "$(find expected-assets -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}" ] || {
            echo "::error::workflow artifacts changed before publication"; exit 1;
          }
          mkdir released-assets
          gh release download "$GITHUB_REF_NAME" --dir released-assets
          [ "$(find released-assets -maxdepth 1 -type f | wc -l)" -eq "$((${#expected[@]} + 1))" ] || {
            echo "::error::draft release asset count changed before publication"; exit 1;
          }
          for asset in "${expected[@]}"; do
            [ -f "expected-assets/$asset" ] && [ -f "released-assets/$asset" ] || {
              echo "::error::missing expected draft asset $asset"; exit 1;
            }
            cmp -s "expected-assets/$asset" "released-assets/$asset" || {
              echo "::error::draft asset $asset differs from this run's tested artifact"; exit 1;
            }
          done
          (cd expected-assets && sha256sum "${expected[@]}") > expected-SHA256SUMS
          cmp -s expected-SHA256SUMS released-assets/SHA256SUMS || {
            echo "::error::draft SHA256SUMS differs from the tested workflow artifacts"; exit 1;
          }
          gh release edit "$GITHUB_REF_NAME" --draft=false
