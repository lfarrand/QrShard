name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: qrshard-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            asset: qrshard-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            asset: qrshard-linux-arm64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            asset: qrshard-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # Actions are pinned to commit SHAs rather than tags throughout. A tag is mutable: whoever
      # controls the action's repository can repoint it at new code, which then runs here with
      # whatever the job holds — in the nuget job below, that is the OIDC token that publishes to
      # nuget.org. The trailing comment records the version each SHA corresponds to.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # need main's history to check what the tag points at

      # A tag can be pushed onto ANY commit, and this workflow publishes to nuget.org, which is
      # irreversible. Requiring the tagged commit to be contained in main means a release can only
      # ship code that went through review and CI, rather than whatever someone tagged.
      - name: Tag must point at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main — refusing to release"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/QrShard.Tests/QrShard.Tests.csproj -c Release

      # Native AOT: single self-contained binary, ~20ms startup. The runners carry the
      # platform C++ toolchains; the trimmed IL analysis is warning-clean.
      - name: Publish (Native AOT)
        run: dotnet publish src/QrShard/QrShard.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PackAsTool=false

      # `dotnet test` above exercises the JIT build. Native AOT is a different compilation model:
      # trimming and reflection fail here and nowhere else, so the binary that users actually
      # download was the least-tested artifact in the release — compiled, zipped and attached
      # without ever being executed. Run it before it is archived, so a broken one cannot ship.
      # Every RID is native to its runner (x64 on windows/ubuntu-latest, arm64 on
      # ubuntu-24.04-arm/macos-latest), so this really runs rather than merely linking.
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          pub="src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish"
          # The AOT output is named after the ASSEMBLY (QrShard), not the tool command (qrshard).
          # Windows and macOS have case-insensitive filesystems, so the lowercase form resolved
          # there and only Linux failed — which is exactly how this shipped green on two platforms.
          bin="$pub/QrShard"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          if [ ! -f "$bin" ]; then
            echo "::error::no binary at $bin — publish layout changed?"
            ls -la "$pub" || true
            exit 1
          fi
          [ -x "$bin" ] || chmod +x "$bin"

          # 1. It starts at all — the check that a trimming or reflection fault would fail — and
          #    reports the version it is being released as. The binary embeds the csproj <Version>
          #    while the NuGet packages take theirs from the tag, so this is also the only thing
          #    that would notice the two drifting apart.
          actual="$("$bin" --version)"
          expected="qrshard ${GITHUB_REF_NAME#v}"
          echo "version: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::binary reports '$actual' but the tag expects '$expected'"
            exit 1
          fi

          # 2. The built-in self-test: encode, simulated screenshot degradation, ECC, and
          #    cross-shard parity recovery, all through the AOT-compiled codec.
          "$bin" test

          # 3. A real file through the real CLI, with a data image deleted so parity has to
          #    rebuild it, compared byte-for-byte independently of the tool's own SHA check.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          head -c 300000 /dev/urandom > "$work/payload.bin"
          "$bin" encode "$work/payload.bin" -o "$work/shards" -r 900 -R 25 > /dev/null
          rm "$(ls "$work"/shards/*.png | head -1)"
          "$bin" decode "$work/shards" -o "$work/out.bin" > /dev/null
          if ! cmp -s "$work/payload.bin" "$work/out.bin"; then
            echo "::error::round trip through the ${{ matrix.rid }} binary did not reproduce the input"
            exit 1
          fi
          echo "round trip OK (parity rebuilt a deleted image)"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish/* -DestinationPath ${{ matrix.asset }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }} -C src/QrShard/bin/Release/net10.0/${{ matrix.rid }}/publish .

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber || gh release create "${{ github.ref_name }}" "${{ matrix.asset }}" --generate-notes

  # Publishes via nuget.org trusted publishing: GitHub mints an OIDC token for this job,
  # nuget.org validates it against a policy naming this repo and workflow file, and hands back
  # a short-lived key. No long-lived API key is stored anywhere.
  #
  # Requires, one time: a policy at https://www.nuget.org/account/trustedpublishing with
  # Repository Owner=lfarrand, Repository=QrShard, Workflow File=release.yml (filename only,
  # no path), Environment blank; plus a NUGET_USER secret holding the nuget.org profile name
  # (not an email). Without NUGET_USER the job still packs and simply skips publishing.
  nuget:
    # Publishing to nuget.org is the one irreversible step in a release: a version can be
    # unlisted but never deleted or reused. So it waits for every binary to have been built AND
    # smoke-tested — if the AOT binary cannot even start, or reports a version that disagrees
    # with the tag, the packages must not go out. `fail-fast: false` above still lets all four
    # legs finish first, so a failure is diagnosed in one run rather than one platform at a time.
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the OIDC token; NuGet/login returns 403 without it
      contents: read    # job-level permissions replace the workflow-level default wholesale
      packages: write   # mirror the same packages to GitHub Packages
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Pack tool and library
        run: |
          dotnet pack src/QrShard/QrShard.csproj -c Release -o nupkg -p:Version=${GITHUB_REF_NAME#v}
          dotnet pack src/QrShard.Core/QrShard.Core.csproj -c Release -o nupkg -p:Version=${GITHUB_REF_NAME#v}

      # Deliberately the last step before the push: the issued key lasts one hour and is
      # single-use, so requesting it any earlier only risks it expiring.
      - name: NuGet login (OIDC)
        if: env.NUGET_USER != ''
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: env.NUGET_USER != ''
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Secondary mirror, so the packages show under the repository's Packages section. Not a
      # public distribution channel: GitHub Packages requires a token with read:packages to
      # install from, even for public repos, so nuget.org above remains the supported source.
      # Uses the run's own GITHUB_TOKEN — no secret to configure.
      - name: Mirror to GitHub Packages
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
