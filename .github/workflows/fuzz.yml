name: Fuzz (deep)

on:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # 20k seeds × 8 sequential facts finished in ~19m locally and exceeded the old 45m
    # hang cap on ubuntu-24.04 (the first run that actually selected FuzzTests).
    timeout-minutes: 120
    env:
      QRSHARD_FUZZ_ITERATIONS: '20000'
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Deep randomized robustness run
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        # xunit.v3 on MTP does not accept the VSTest FullyQualifiedName filter. Passing it
        # matches nothing (exit 5, "Zero tests ran"). Use xunit's class filter instead.
        run: >
          dotnet test tests/QrShard.Tests/QrShard.Tests.csproj -c Release
          -- --filter-class QrShard.Tests.FuzzTests --minimum-expected-tests 1
          --output-console-verbosity detailed
