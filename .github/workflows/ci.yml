name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Every platform the release matrix publishes a binary for must also run the suite here,
        # so a platform-specific failure is caught on the PR, not at release time. (linux-arm64
        # was release-only until an arm64-timing test failure blocked its v1.3.0 binary.)
        os: [windows-2025, ubuntu-22.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Build
        env:
          # Scoped to compilation: third-party report/checkout actions never receive it.
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build -c Release -warnaserror

      - name: Test
        run: >
          dotnet test tests/QrShard.Tests/QrShard.Tests.csproj -c Release --no-build
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=${{ matrix.os }}.trx"
          --results-directory TestResults

      # Totals and a per-class breakdown, rendered into the run summary.
      #
      # `always()` because a red run is exactly when the report is worth reading, and the Test
      # step has already failed the job by that point.
      #
      # use-actions-summary (default true) writes the job summary INSTEAD of creating a check
      # run — see the branch in the action's main.ts. That is the reason this needs nothing
      # beyond the workflow's `contents: read`: the check-run path calls checks.create, which
      # would need `checks: write` and would fail outright on a pull request from a fork.
      - name: Test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Tests (${{ matrix.os }})
          path: TestResults/${{ matrix.os }}.trx
          reporter: dotnet-trx
          # The Test step is what decides whether the job passes. Letting this fail as well would
          # put a second red X on a step that only formats the result, pointing away from the
          # actual failure.
          fail-on-error: false
          # A compile failure legitimately produces no TRX. The build/test step is already red;
          # the optional formatter must not manufacture a second, less useful failure.
          fail-on-empty: false

      # test-reporter lists every test case but prints no per-test duration — it parses the
      # figure and then aggregates it to the suite. This adds the part that is actually
      # actionable when the suite starts to drag: which individual tests are costing the time.
      - name: Slowest tests
        if: always()
        shell: pwsh
        run: |
          $path = "TestResults/${{ matrix.os }}.trx"
          if (-not (Test-Path $path)) { exit 0 }
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $trx = [xml](Get-Content $path -Raw)
          $all = Select-Xml -Xml $trx -Namespace $ns -XPath '//t:UnitTestResult' | ForEach-Object { $_.Node }
          if (-not $all) { exit 0 }

          $counters = (Select-Xml -Xml $trx -Namespace $ns -XPath '//t:ResultSummary/t:Counters').Node
          $total = [TimeSpan]::Zero
          foreach ($t in $all) { if ($t.duration) { $total += [TimeSpan]::Parse($t.duration) } }

          $out = @(
            "### Slowest tests — ${{ matrix.os }}",
            "",
            ("{0} tests, {1} passed, {2} failed — {3:N1}s of test time" -f `
              $counters.total, $counters.passed, $counters.failed, $total.TotalSeconds),
            "",
            "| Time | Test |",
            "|---:|:---|"
          )
          foreach ($t in ($all | Sort-Object { [TimeSpan]::Parse($_.duration) } -Descending | Select-Object -First 15)) {
            # Names carry theory arguments, so they can be long and could contain a pipe that
            # would silently break the table. Trim the fixed namespace, cap the length, escape.
            $name = $t.testName -replace '^QrShard\.Tests\.', '' -replace '\|', '\|'
            if ($name.Length -gt 90) { $name = $name.Substring(0, 89) + '…' }
            $out += "| {0:N2}s | {1} |" -f [TimeSpan]::Parse($t.duration).TotalSeconds, $name
          }
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Round-trip self-test
        run: dotnet run --project src/QrShard -c Release --no-build -- test

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
      - name: Fail on known vulnerable transitive packages
        shell: bash
        run: |
          set -euo pipefail
          # NU1900 means the advisory source could not be queried. Treating it as a warning
          # silently turns a green audit into "not audited"; retry transient failures, then fail.
          for attempt in 1 2 3; do
            if dotnet restore QrShard.slnx \
              -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
              "-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904"; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] || sleep $((attempt * 5))
          done
          exit 1
